ion class="scene" id="scene-4" data-layout-allow-overlap="true" data-layout-allow-occlusion="true"><img class="art" src="media/05-departure.jpg" alt="AI 创作画面：父母在家门口送别带着行李的女儿" loading="eager" decoding="async" data-layout-allow-overflow="true" style="object-position: 50% 50%;"><div class="scene-content"><p class="time">孩子长大了</p><p class="caption">孩子去了很远的地方。灯还亮着。</p></div></section><section class="scene" id="scene-5" data-layout-allow-overlap="true" data-layout-allow-occlusion="true"><img class="art" src="media/06-aging.jpg" alt="AI 创作画面：白发夫妻在修表桌前相伴" loading="eager" decoding="async" data-layout-allow-overflow="true" style="object-position: 50% 45%;"><div class="scene-content"><p class="time">不知不觉</p><p class="caption">表针越来越小。她把灯，又挪近了一点。</p></div></section><section class="scene" id="scene-6" data-layout-allow-overlap="true" data-layout-allow-occlusion="true"><img class="art" src="media/07-care.jpg" alt="AI 创作画面：老人俯身替病中的妻子掖好被角" loading="eager" decoding="async" data-layout-allow-overflow="true" style="object-position: 50% 48%;"><div class="scene-content"><p class="time">那年冬天</p><p class="caption">她睡得越来越早。他把灯调暗了一点。</p></div></section><section class="scene" id="scene-7" data-layout-allow-overlap="true" data-layout-allow-occlusion="true"><img class="art" src="media/08-empty.jpg" alt="AI 创作画面：老人面前是两只碗，对面是一把空椅" loading="eager" decoding="async" data-layout-allow-overflow="true" style="object-position: 50% 50%;"><div class="scene-content"><p class="time">又到春天</p><p class="caption">这一年，他还是摆了两只碗。</p></div></section><section class="scene" id="scene-8" data-layout-allow-overlap="true" data-layout-allow-occlusion="true"><img class="art" src="media/09-return.jpg" alt="AI 创作画面：小外孙女扑向外公，女儿跟在身后" loading="eager" decoding="async" data-layout-allow-overflow="true" style="object-position: 50% 45%;"><div class="scene-content"><p class="time">一个傍晚</p><p class="caption">门外，有人喊了一声：外公。</p></div></section><section class="scene" id="scene-9" data-layout-allow-overlap="true" data-layout-allow-occlus
